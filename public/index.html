<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <title>Party Hub</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    input {
      padding: 10px;
      margin: 5px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }

    #players div {
      margin: 5px;
    }
  </style>
</head>

<body>

  <!-- 🔐 LOGIN -->
  <div id="login">
    <h2>Giriş</h2>

    <input id="roomId" placeholder="Oda kodu">
    <br>
    <input id="name" placeholder="İsim">
    <br>

    <button onclick="joinRoom()">Giriş Yap</button>
  </div>

  <!-- 🏠 LOBBY -->
  <div id="app" style="display:none;">

    <h2 id="roomText"></h2>

    <h3>Oyuncular</h3>
    <div id="players"></div>

    <hr>

    <h3>Oyunlar</h3>

    <button onclick="selectGame('tabu')">🧠 Tabu</button>
    <button onclick="selectGame('dc')">😈 DC</button>

    <br><br>

    <button onclick="nextTurn()">🎯 Random Turn</button>

    <h3 id="turn"></h3>

  </div>

  <!-- 🎮 GAME SCREEN -->
  <div id="gameScreen" style="display:none;">

    <h1 id="gameTitle"></h1>

    <div id="timer" style="font-size:30px;"></div>

    <div id="gameContent" style="margin:20px; font-size:24px;"></div>

    <button onclick="nextTabu()">🎲 Yeni Kelime</button>
    <button onclick="backLobby()">⬅ Geri</button>

  </div>

  <!-- JS -->
  <script type="module" src="app.js"></script>

</body>
</html>
