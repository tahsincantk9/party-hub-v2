<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <title>Party Hub</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    input {
      padding: 10px;
      margin: 5px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }

    #players div {
      margin: 5px;
    }
  </style>
</head>

<body>

  <!-- 🔐 LOGIN -->
  <div id="login">

  <h1>🎮 Party Hub</h1>

  <input id="roomId" placeholder="Oda Kodu">
  <br>
  <input id="name" placeholder="İsim">
  <br>

  <button onclick="joinRoom()">Giriş Yap</button>

</div>

  <!-- 🏠 LOBBY -->
  <div id="app" style="display:none;">

    <h2 id="roomText"></h2>

    <h3>Oyuncular</h3>
    <div id="players"></div>

    <hr>

    <h3>Oyunlar</h3>

    <button onclick="selectGame('tabu')">🧠 Tabu</button>
    <button onclick="selectGame('dc')">😈 DC</button>

    <br><br>

    <button onclick="nextTurn()">🎯 Random Turn</button>

    <h3 id="turn"></h3>

  </div>

  <!-- 🎮 GAME SCREEN -->
  <div id="gameScreen" style="display:none;">

    <h1 id="gameTitle"></h1>

    <div id="timer" style="font-size:30px;"></div>

    <div id="gameContent" style="margin:20px; font-size:24px;"></div>

    <button onclick="selectGame('tabu')">🧠 Tabu</button>
    <button onclick="selectGame('truth')">💬 Doğruluk</button>
    <button onclick="selectGame('dare')">🔥 Cesaret</button>
    <button onclick="selectGame('quiz')">❓ Quiz</button>
    <button onclick="selectGame('who')">👀 Kim Bu?</button>
    <button onclick="selectGame('never')">🚫 Never Have I Ever</button>
    <button onclick="selectGame('word')">🔤 Kelime Zinciri</button>
    <button onclick="selectGame('bomb')">💣 Bomba</button>
    <button onclick="selectGame('draw')">🎨 Çiz & Tahmin</button>
    <button onclick="selectGame('meme')">😂 Meme Battle</button>
    <button onclick="correct()">✔ Doğru</button>
    <button onclick="skip()">⏭ Pas</button>
    <button onclick="wrong()">❌ Yanlış</button>

  </div>

  <!-- JS -->
  <script type="module" src="app.js"></script>

</body>
</html>
